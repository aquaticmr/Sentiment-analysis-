<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment Analysis</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; margin: 2em; background-color: #f4f4f9; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 2em; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #555; }
        textarea { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ddd; font-size: 1em; }
        button { display: block; width: 100%; padding: 10px; margin-top: 1em; border: none; background-color: #007bff; color: white; font-size: 1em; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .prediction { margin-top: 1.5em; font-size: 1.2em; font-weight: bold; padding: 1em; border-radius: 4px; }
        .positive { color: #28a745; background-color: #e9f7ef; border: 1px solid #28a745; }
        .negative { color: #dc3545; background-color: #fce8e6; border: 1px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentiment Analysis</h1>
        <form action="/predict" method="post">
            <textarea name="review" rows="5" placeholder="Enter a review here...">{{ review if review }}</textarea>
            <button type="submit">Predict Sentiment</button>
        </form>

        {% if prediction %}
            {% if prediction == "Positive" %}
                <div class="prediction positive">
                    Prediction: {{ prediction }}
                </div>
            {% else %}
                <div class="prediction negative">
                    Prediction: {{ prediction }}
                </div>
            {% endif %}
        {% endif %}
    </div>
</body>
</html>
